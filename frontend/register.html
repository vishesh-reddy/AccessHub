<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AccessHub Register</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container narrow"><div class="card"><h1>Create account</h1><form id="registerForm"><input id="name" placeholder="Full name" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Phone"><input id="flat" placeholder="Flat number (residents)"><input id="password" type="password" minlength="8" placeholder="Password" required><select id="role"><option value="resident">Resident</option><option value="guard">Security Guard</option></select><button class="btn">Register</button><p id="message" class="message"></p></form></div></main><script src="js/auth.js"></script></body></html>
